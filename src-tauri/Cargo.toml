[package]
name = "codetally"
version = "0.1.2"
description = "A local CodeTally dashboard"
authors = ["CodeTally"]
edition = "2021"

[lib]
name = "codetally_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1"
open = "5"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

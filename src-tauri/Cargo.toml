[package]
name = "codetally"
version = "0.1.2"
description = "A local CodeTally dashboard"
authors = ["CodeTally"]
edition = "2021"

[lib]
name = "codetally_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "1"
open = "5"
url = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tauri-plugin-updater = "=2.11.0"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSStatusItem", "NSMenu", "NSMenuItem", "NSImage", "NSImageView", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSGeometry", "NSObject", "NSString"] }
png = "0.17.16"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

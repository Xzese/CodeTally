name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    # A main → release PR contains a commit that has already passed this same
    # suite on the push to main. The release workflow validates it again after
    # the PR merges, so avoid a second identical CI run here.
    if: github.event_name != 'pull_request' || github.head_ref != 'main' || github.base_ref != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Test release preflight
        run: node --test scripts/release-preflight.check.mjs

      - name: Build frontend
        run: npm run build

  desktop:
    name: Desktop checks (${{ matrix.architecture }})
    if: github.event_name != 'pull_request' || github.head_ref != 'main' || github.base_ref != 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
          - architecture: Intel
            os: macos-latest
            target: x86_64-apple-darwin
            run_tests: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci-${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tokei for backend tests
        if: matrix.run_tests
        run: brew install tokei

      - name: Run backend tests
        if: matrix.run_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build native app
        run: npm run tauri:build -- --ci --no-bundle --target ${{ matrix.target }} -- --locked

name: Release desktop app

on:
  push:
    branches:
      - release

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Release version check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test automatic version selection
        run: node --test scripts/release-preflight.check.mjs
      - name: Select release version before building
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs

  checks:
    name: Test before release
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tokei for backend scanner tests
        run: brew install tokei

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.architecture }} bundle
    needs: [preflight, checks]
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            target: aarch64-apple-darwin
            installer: Apple-Silicon_aarch64
          - architecture: Intel
            target: x86_64-apple-darwin
            installer: Intel_x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply the selected version to both app and lockfiles
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-preflight.mjs --set-version

      - name: Build Tauri bundle
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Verify macOS bundle signature
        env:
          TARGET: ${{ matrix.target }}
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/$TARGET/release/bundle/macos/CodeTally.app"

      - name: Collect DMG artifact
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dmgs="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print)"
          if [[ -z "$dmgs" ]]; then
            echo 'No DMG was produced.' >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$dmgs" | wc -l | tr -d ' ')" != 1 ]]; then
            echo 'Expected exactly one DMG per architecture.' >&2
            exit 1
          fi
          cp "$dmgs" "artifacts/CodeTally_${VERSION}_${INSTALLER}.dmg"
          ls -lh artifacts

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetally-${{ matrix.target }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codetally-*
          path: artifacts
          merge-multiple: true

      - name: Verify tag availability and both DMGs
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$TAG"
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} was created during this run. Retry the workflow to select the next version." >&2
            exit 1
          fi
          test "$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
        env:
          TAG: ${{ needs.preflight.outputs.tag }}

      - name: Create release and upload both DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Download Apple-Silicon_aarch64 for Macs with Apple M-series chips, or Intel_x64 for Intel Macs.

          These builds are ad-hoc signed, but not Developer ID signed or notarized. macOS may require approval in System Settings → Privacy & Security.
          EOF
          gh release create "$TAG" artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "CodeTally $VERSION" \
            --notes-file release-notes.md \
            --generate-notes

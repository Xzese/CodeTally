name: Release desktop app

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Test before release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tokei for backend scanner tests
        run: brew install tokei

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.architecture }} bundle
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            target: aarch64-apple-darwin
          - architecture: Intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Collect DMG artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t dmgs < <(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print)
          if (( ${#dmgs[@]} == 0 )); then
            echo 'No DMG was produced.' >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            cp "$dmg" artifacts/
          done
          ls -lh artifacts

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetally-${{ matrix.target }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codetally-*
          path: artifacts
          merge-multiple: true

      - name: Require a new version for each release
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(awk -F '"' '/^version = "/ { print $2; exit }' src-tauri/Cargo.toml)"
          RELEASE_TAG="v${APP_VERSION}"

          if [[ "${APP_VERSION}" != "${PACKAGE_VERSION}" || "${APP_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tauri=${APP_VERSION}, npm=${PACKAGE_VERSION}, cargo=${CARGO_VERSION}." >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} already exists. Bump the app version before releasing again." >&2
            exit 1
          fi
          test "$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
          {
            echo "VERSION=${APP_VERSION}"
            echo "TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Create release and upload both DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          Automated unsigned macOS builds for Apple Silicon and Intel.

          macOS may require users to approve the app in Privacy & Security because these artifacts are not notarized.
          EOF
          gh release create "$TAG" artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeTally $VERSION" \
            --notes-file release-notes.md \
            --generate-notes

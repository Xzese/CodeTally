name: Release desktop app

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Test before release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tokei for backend scanner tests
        run: brew install tokei

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  publish:
    name: Build ${{ matrix.architecture }} release
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            target: aarch64-apple-darwin
          - architecture: Intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Require a new version for each release merge
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(awk -F '"' '/^version = "/ { print $2; exit }' src-tauri/Cargo.toml)"
          RELEASE_TAG="v${APP_VERSION}"

          if [[ "${APP_VERSION}" != "${PACKAGE_VERSION}" || "${APP_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::Version mismatch: tauri=${APP_VERSION}, npm=${PACKAGE_VERSION}, cargo=${CARGO_VERSION}."
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${RELEASE_TAG} already belongs to ${TAG_COMMIT}. Bump the app version before merging into release."
              exit 1
            fi
          fi

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CodeTally v__VERSION__
          releaseBody: |
            Automated unsigned macOS builds for Apple Silicon and Intel.

            macOS may require users to approve the app in Privacy & Security because these artifacts are not notarized.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          uploadUpdaterJson: false
          retryAttempts: 2
          args: --target ${{ matrix.target }}

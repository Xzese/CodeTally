name: Release desktop app

on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
    branches: [main]
  pull_request:
    branches:
      - release
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release version check
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test automatic version selection
        run: node --test scripts/release-preflight.check.mjs
      - name: Select release version before building
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs

  checks:
    name: Test before release
    needs: preflight
    if: github.event_name != 'pull_request' && needs.preflight.outputs.publish == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Tokei for backend scanner tests
        run: brew install tokei

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.architecture }} bundle
    needs: [preflight, checks]
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            target: aarch64-apple-darwin
          - architecture: Intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Apply the selected version to both app and lockfiles
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release-preflight.mjs --set-version

      - name: Build Tauri bundle
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Collect DMG artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dmgs="$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print)"
          if [[ -z "$dmgs" ]]; then
            echo 'No DMG was produced.' >&2
            exit 1
          fi
          while IFS= read -r dmg; do
            [[ -n "$dmg" ]] && cp "$dmg" artifacts/
          done <<< "$dmgs"
          ls -lh artifacts

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetally-${{ matrix.target }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codetally-*
          path: artifacts
          merge-multiple: true

      - name: Verify tag availability and both DMGs
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$TAG"
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} was created during this run. Retry the workflow to select the next version." >&2
            exit 1
          fi
          test "$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 2
        env:
          TAG: ${{ needs.preflight.outputs.tag }}

      - name: Create release and upload both DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Automated unsigned macOS builds for Apple Silicon and Intel.

          macOS may require users to approve the app in Privacy & Security because these artifacts are not notarized.
          EOF
          gh release create "$TAG" artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "CodeTally $VERSION" \
            --notes-file release-notes.md \
            --generate-notes
